# Local Grafana + Loki to try the plugin with the fixtures. Not for production.
# From the repository root:  docker compose -p replay-plugin-test -f tests/stack/compose.yaml up -d
name: replay-plugin-test
services:
  grafana:
    image: 'grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf'
    ports: ['127.0.0.1:13000:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: 'admin'
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: 'escalia-sessionreplay-app'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - '../../dist:/var/lib/grafana/plugins/escalia-sessionreplay-app:ro'
      - './provisioning:/etc/grafana/provisioning:ro'
    depends_on: [loki]
  loki:
    image: 'grafana/loki:3.6.22@sha256:4cf4ceb20e88b0543c88b541a71797c22a46eade04dd588dcdebf9f2b9c36063'
    command: ['-config.file=/etc/loki/config.yaml']
    ports: ['127.0.0.1:13100:3100']
    volumes:
      - './loki.yaml:/etc/loki/config.yaml:ro'
